vsync = true
tabs = true
wayland-app-id = "neovide"

[box-drawing]
mode = "native"

[box-drawing.sizes]
default = [2, 4] # Thin and thick values respectively, for all sizes

[font]
hinting = "full"
size = 10
edging = "antialias"

[font.features]
"Maple Mono NF" = [
  "+ss01",
  "+ss07",
  "+ss11",
  "+liga",
  "+calt",
  "+zero",
  "+ss09",
  "+ss02",
  "+ss14",
]

[[font.normal]]
family = "Maple Mono NF"
style = "Light"

# Fallback font
[[font.normal]]
family = "Maple Mono NF"
style = "Light"

# Fallback font (Persian font support)
[[font.normal]]
family = "Vazirmatn"

[[font.italic]]
family = "Maple Mono NF"
style = "Light Italic"

[[font.bold]]
family = "Maple Mono NF"

# [[font.bold]]
# family = "MonoLisa"
# style = "Semi-Bold"

# [[font.bold_italic]]
# family = "MonoLisa"
# style = "Semi-Bold Italic"
